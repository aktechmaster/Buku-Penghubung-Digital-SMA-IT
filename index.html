<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Al-Kautsar</title>

    <!-- ✅ Favicon lengkap & kompatibel -->
    <link rel="icon" type="image/png" sizes="32x32" href="logosmpblack.png">
    <link rel="icon" type="image/png" sizes="16x16" href="logosmpblack.png">
    <link rel="shortcut icon" href="logosmpblack.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> 
        body { 
            font-family: 'Poppins', sans-serif; 
        } 
    </style>
</head>
</head>
<body class="min-h-screen flex items-center justify-center p-6" style="
    background: #8c92ac url('circuitboard.svg') repeat;
    background-size: 1440px 560px;
    background-blend-mode: soft-light;
">

    <div class="w-full max-w-sm text-center bg-white p-8 rounded-3xl shadow-xl">
        <div class="mb-6 flex justify-center">
            <div class="w-20 h-20 bg-emerald-600 rounded-2xl flex items-center justify-center shadow-lg transform rotate-3">
                <img src="logosmpit.png" alt="Logo" class="w-14 h-14 object-contain -rotate-3">
            </div>
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-1">My Al-Kautsar</h1>
        <p class="text-sm text-gray-500 mb-8">Buku Penghubung DIGITAL</p>

        <form id="login-form" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1 ml-1">USERNAME / NIS</label>
                <input type="text" id="username" placeholder="Masukkan NIS Siswa" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1 ml-1">PASSWORD</label>
                <input type="password" id="password" placeholder="Masukkan Password" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition" required>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-emerald-200 transition active:scale-95 mt-4">
                Masuk Portal
            </button>
        </form>
        <p class="mt-8 text-xs text-gray-400">&copy; 2026 <span>SMA IT Al-Kautsar</span> <br> Designed & Developed by aktechmaster</p>
    </div>

    <script>
    // URL GOOGLE SCRIPT ANDA
    const SPREADSHEET_ID = "1oiIsjL6S7ESz00Kh_WlM3SXSWs8xVEbob0QjYgJn-Mw";
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxiDToc3gBf0sWDvPe81G5rMpY_mixbY5JhcbLUvmjZgzv1qTSx7BWtOvfXdHMQg7nfUw/exec';

const loginForm = document.getElementById('login-form');
const btnLogin = loginForm.querySelector('button');

loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    
    const username = document.getElementById('username').value.trim();
    const originalText = btnLogin.innerText;
    
    btnLogin.innerText = "Mengecek Data...";
    btnLogin.disabled = true;

    // Panggil GAS Original (Mengembalikan Array [ {nama, kelas, jk}, ... ])
    fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(students => {
            // Cari siswa berdasarkan nama/NIS
            const siswa = students.find(s => 
                String(s.nama).toLowerCase().trim() === username.toLowerCase().trim()
            );

            if (siswa) {
                localStorage.setItem('user_data', JSON.stringify(siswa));
                localStorage.setItem('nisn', siswa.nama);
                window.location.href = 'dashboardortu.html';
            } else {
                alert("Nama / NISN tidak ditemukan di Database!");
                resetButton(originalText);
            }
        })
        .catch(error => {
            console.error("Detail Error:", error);
            alert("Gagal terhubung ke server.");
            resetButton(originalText);
        });
});

function resetButton(text) {
    btnLogin.innerText = text;
    btnLogin.disabled = false;
}
</script>
</body>
</html>
